---
# Woodpecker CI workflow: pre-commit
# Runs the hooks from .pre-commit-config.yaml (same ruleset as upstream GitHub).
#
# Based on .taskfile-templates/woodpecker/lint.yml.
#
# The `lychee-docker` hook is skipped in the `pre-commit` step: pre-commit
# bind-mounts the step's workspace path into the hook container, which does
# not exist on the Docker host (Woodpecker uses a volume). The `link-check`
# step runs the same check through `task test:check`, which uses
# --volumes-from instead.

# See .taskfile-templates/README.md > Woodpecker CI wiring for why this clone:
# block looks like this (SSH submodule URL rewrite, environment: vs settings:).
clone:
  - name: git
    image: woodpeckerci/plugin-git
    environment:
      PLUGIN_RECURSIVE: "true"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "url.https://git.3mdeb.com/.insteadOf"
      GIT_CONFIG_VALUE_0: "ssh://git@git.3mdeb.com:2222/"

variables:
  - &install-task sh .taskfile-templates/scripts/install-task.sh

# Branch rulesets gate on the PR run, so push only covers the default branch
# (post-merge) instead of duplicating every PR run on its source branch.
when:
  - event: [pull_request, manual]
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: pre-commit
    image: python:3.12-slim
    environment:
      TASK_VERSION: v3.44.0
      SKIP: lychee-docker
    commands:
      # System node/npm makes pre-commit use language_version `system` for
      # node hooks (markdownlint) instead of nodeenv, whose version parsing
      # breaks on pre-release entries in the Node.js release index.
      - apt-get update -qq && apt-get install -y --no-install-recommends git curl nodejs npm
      - pip install --quiet pre-commit
      - *install-task
      - task lint:run

  - name: link-check
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TASK_VERSION: v3.44.0
    commands:
      - *install-task
      - task test:check
